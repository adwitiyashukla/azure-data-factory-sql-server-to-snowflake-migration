name: infra

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      apply:
        description: run terraform apply on the main root
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_admin_object_id: ${{ vars.ADMIN_OBJECT_ID }}
  TF_VAR_admin_login: ${{ vars.ADMIN_LOGIN }}
  TF_VAR_admin_ip: ${{ vars.ADMIN_IP }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_ci_principal_id: ${{ vars.CI_PRINCIPAL_ID }}
  TF_VAR_onprem_sql_password: ${{ secrets.ONPREM_SQL_PASSWORD }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra/bootstrap
      - run: terraform validate
        working-directory: infra/bootstrap
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true

  plan:
    needs: check
    if: github.event_name != 'workflow_dispatch' || !inputs.apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform init -input=false
        working-directory: infra
      - run: terraform plan -input=false -lock-timeout=5m
        working-directory: infra

  apply:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform init -input=false
        working-directory: infra
      - run: terraform apply -input=false -auto-approve -lock-timeout=5m
        working-directory: infra
